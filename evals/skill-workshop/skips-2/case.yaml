schema_version: "1.1"
name: skill-workshop-skips-2
tags: [skill-workshop, near-miss]
description: "Near miss: not a skill."
execution:
  prompt: "Write a GitHub Actions workflow that runs the tests on every push."
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?skill-workshop"'
    min: 0
    max: 0
    arm: both
