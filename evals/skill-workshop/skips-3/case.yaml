schema_version: "1.1"
name: skill-workshop-skips-3
tags: [skill-workshop, near-miss]
description: "Near miss: claude-kb-lookup."
execution:
  prompt: "Which model should a code-reviewer subagent use?"
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
