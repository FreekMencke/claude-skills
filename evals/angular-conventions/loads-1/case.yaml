schema_version: "1.1"
name: angular-conventions-loads-1
tags: [angular-conventions, should-load]
execution:
  prompt: "What are our Angular conventions for where HTTP calls live and how state shared between components is kept?"
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?angular-conventions"'
