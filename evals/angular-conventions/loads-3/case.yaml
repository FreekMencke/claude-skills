schema_version: "1.1"
name: angular-conventions-loads-3
tags: [angular-conventions, should-load]
execution:
  prompt: "I'm adding a landing page to our Angular SSR app (custom Express server). Following our conventions, how do I set its route title, page meta and CSP nonce?"
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?angular-conventions"'
