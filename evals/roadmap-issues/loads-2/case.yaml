schema_version: "1.1"
name: roadmap-issues-loads-2
tags: [roadmap-issues, should-load]
execution:
  prompt: "Break the dark-mode feature into GitHub issues, as sub-issues of one parent with blocked-by links between them."
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?roadmap-issues"'
