schema_version: "1.1"
name: roadmap-issues-skips-4
tags: [roadmap-issues, near-miss]
description: "Near miss: one issue in the current repo (#3)."
execution:
  prompt: "Open an issue in this repo for the flaky login test so we don't forget it."
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?roadmap-issues"'
    min: 0
    max: 0
    arm: both
