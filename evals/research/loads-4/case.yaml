schema_version: "1.1"
name: research-loads-4
tags: [research, should-load]
execution:
  prompt: "Fact-check these numbers before I put them in the issue: Cloudflare Workers free plan allows 100,000 requests a day and 10 ms CPU time per request."
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?research"'
