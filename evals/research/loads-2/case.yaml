schema_version: "1.1"
name: research-loads-2
tags: [research, should-load]
execution:
  prompt: "Compare Valkey and Redis before we pick one for our session cache: licensing, managed offerings and compatibility, with sources."
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?research"'
