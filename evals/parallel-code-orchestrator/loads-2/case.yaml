schema_version: "1.1"
name: parallel-code-orchestrator-loads-2
tags: [parallel-code-orchestrator, should-load]
execution:
  prompt: "Implement roadmap issue #12: it spans the API client, three services and their tests. Orchestrate it."
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?parallel-code-orchestrator"'
