schema_version: "1.1"
name: refresh-md-files-loads-2
tags: [refresh-md-files, should-load]
execution:
  prompt: "Our docs/ folder has drifted from the code. Find what's outdated or ambiguous."
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?refresh-md-files"'
