schema_version: "1.1"
name: refresh-md-files-loads-4
tags: [refresh-md-files, should-load]
description: "CLAUDE.md drift audit still loads after the claude-md-improver boundary (#3)."
execution:
  prompt: "Check CLAUDE.md for commands and paths that no longer match the code."
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?refresh-md-files"'
