<!doctype html>
<!--
  Source of assets/banner.png (light) and assets/banner-dark.png, 1280x640 (GitHub's social preview size).
  To render: copy variable/SOLIX[wght].woff2 from the latest FreekMencke/solix release's zip next to this file as
  SOLIX-Variable.woff2, serve the folder over HTTP, open banner.html#light and banner.html#dark at a 1280x640
  viewport and screenshot each once fonts are loaded.
-->
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: 'SOLIX'; font-weight: 100 900; font-display: block; src: url(SOLIX-Variable.woff2) format('woff2'); }
/* freek-mencke-web's tokens: theme.css (light) and base.css .dark */
:root { --ground:#f4f5f7; --ink:#172033; --accent:#047857; --muted:#586274; --meta:#7d8798; --shadow:rgba(12,59,47,.25); }
.dark { --ground:#0b1613; --ink:#e3ebe7; --accent:#34d399; --muted:#93a59d; --meta:#6b7f77; --shadow:rgba(0,0,0,.55); }
body { margin:0; width:1280px; height:640px; background:var(--ground); display:flex; align-items:center; justify-content:center; gap:72px; font-family:SOLIX, sans-serif; }
img { width:300px; height:300px; filter:drop-shadow(0 18px 30px var(--shadow)); }
.mark { font-weight:600; font-size:112px; line-height:1; color:var(--ink); letter-spacing:-3px; }
.mark span { color:var(--accent); }
.tag { margin-top:28px; font-weight:400; font-size:34px; line-height:1.3; color:var(--muted); }
.meta { margin-top:26px; font-weight:500; font-size:24px; letter-spacing:0.02em; color:var(--meta); }
.meta b { font-weight:inherit; margin:0 0.5em; }
</style></head>
<body><script>if (location.hash === '#dark') document.documentElement.className = 'dark'</script>
<img src="logo.svg" alt="">
<div>
  <div class="mark">claude<span>-skills</span></div>
  <div class="tag">Claude Code skills,<br>published as a plugin marketplace.</div>
  <div class="meta">roadmaps<b>&middot;</b>audits<b>&middot;</b>research<b>&middot;</b>Angular</div>
</div></body></html>
