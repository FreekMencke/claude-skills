schema_version: "1.1"
name: parallel-code-orchestrator-skips-2
tags: [parallel-code-orchestrator, near-miss]
description: "Near miss: roadmap-issues."
execution:
  prompt: "Break this feature into GitHub issues with blocked-by links so I can work on them later."
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?parallel-code-orchestrator"'
    min: 0
    max: 0
    arm: both
