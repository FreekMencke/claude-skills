schema_version: "1.1"
name: parallel-code-orchestrator-loads-1
tags: [parallel-code-orchestrator, should-load]
execution:
  prompt: "Migrate all 40 Angular components in this repo from NgModules to standalone components, and parallelize the work over subagents."
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?parallel-code-orchestrator"'
