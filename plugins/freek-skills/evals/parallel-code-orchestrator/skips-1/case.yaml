schema_version: "1.1"
name: parallel-code-orchestrator-skips-1
tags: [parallel-code-orchestrator, near-miss]
description: "Near miss: a small edit."
execution:
  prompt: "Rename getUser to fetchUser in src/user.ts and update its two call sites."
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?parallel-code-orchestrator"'
    min: 0
    max: 0
    arm: both
