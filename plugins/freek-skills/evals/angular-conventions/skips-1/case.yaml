schema_version: "1.1"
name: angular-conventions-skips-1
tags: [angular-conventions, near-miss]
description: "Near miss: an Angular API question (angular-developer)."
execution:
  prompt: "Explain how linkedSignal differs from computed in Angular, with a short example."
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?angular-conventions"'
    min: 0
    max: 0
    arm: both
