schema_version: "1.1"
name: angular-conventions-skips-5
tags: [angular-conventions, near-miss]
description: "Near miss: a doc audit in an Angular repo (refresh-md-files)."
execution:
  prompt: "Audit the README and CLAUDE.md of this Angular repo for stale or outdated content."
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?angular-conventions"'
    min: 0
    max: 0
    arm: both
