schema_version: "1.1"
name: angular-conventions-skips-3
tags: [angular-conventions, near-miss]
description: "Near miss: a new app (angular-developer)."
execution:
  prompt: "Create a new Angular 22 app with SSR, Tailwind and Vitest."
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?angular-conventions"'
    min: 0
    max: 0
    arm: both
