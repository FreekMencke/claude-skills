schema_version: "1.1"
name: research-skips-3
tags: [research, near-miss]
description: "Near miss: a plain code change."
execution:
  prompt: "Add a retry with exponential backoff to the fetchUser function in src/api.ts."
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?research"'
    min: 0
    max: 0
    arm: both
