schema_version: "1.1"
name: research-skips-2
tags: [research, near-miss]
description: "Near miss: a question an installed knowledge base answers."
execution:
  prompt: "Our installed knowledge-base skill covers this: which effort level should a code-review subagent run at?"
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?research"'
    min: 0
    max: 0
    arm: both
