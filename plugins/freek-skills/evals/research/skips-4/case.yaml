schema_version: "1.1"
name: research-skips-4
tags: [research, near-miss]
description: "Near miss: docs checked against the code, refresh-md-files territory."
execution:
  prompt: "Audit the README for setup steps that no longer match the code."
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?research"'
    min: 0
    max: 0
    arm: both
