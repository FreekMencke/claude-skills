schema_version: "1.1"
name: refresh-md-files-loads-3
tags: [refresh-md-files, should-load]
execution:
  prompt: "Review CONTRIBUTING.md from a new contributor's point of view and list the gaps."
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?refresh-md-files"'
