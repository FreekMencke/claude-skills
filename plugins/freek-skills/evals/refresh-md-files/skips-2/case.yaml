schema_version: "1.1"
name: refresh-md-files-skips-2
tags: [refresh-md-files, near-miss]
description: "Near miss: skill-workshop."
execution:
  prompt: "Audit skills/deploy/SKILL.md: is its description good enough to trigger reliably?"
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?refresh-md-files"'
    min: 0
    max: 0
    arm: both
