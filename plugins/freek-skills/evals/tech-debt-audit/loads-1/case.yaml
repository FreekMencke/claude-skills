schema_version: "1.1"
name: tech-debt-audit-loads-1
tags: [tech-debt-audit, should-load]
execution:
  prompt: "Do a tech debt audit of this repo and give me a prioritised plan for paying it down."
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?tech-debt-audit"'
