schema_version: "1.1"
name: tech-debt-audit-skips-2
tags: [tech-debt-audit, near-miss]
description: "Near miss: a docs-only audit (refresh-md-files)."
execution:
  prompt: "Check the README for stale setup steps and wrong commands."
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?tech-debt-audit"'
    min: 0
    max: 0
    arm: both
