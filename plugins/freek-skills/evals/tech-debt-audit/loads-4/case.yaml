schema_version: "1.1"
name: tech-debt-audit-loads-4
tags: [tech-debt-audit, should-load]
execution:
  prompt: "Go through src/payments for outdated dependencies, dead code and missing tests, and rank what to clean up."
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?tech-debt-audit"'
