schema_version: "1.1"
name: tech-debt-audit-skips-4
tags: [tech-debt-audit, near-miss]
description: "Near miss: orchestrating a large change (parallel-code-orchestrator)."
execution:
  prompt: "Split this migration to the new ORM into parallel pieces and run them."
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?tech-debt-audit"'
    min: 0
    max: 0
    arm: both
