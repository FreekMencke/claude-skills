schema_version: "1.1"
name: skill-workshop-skips-1
tags: [skill-workshop, near-miss]
description: "Near miss: refresh-md-files."
execution:
  prompt: "Audit the README in this repo for stale content."
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?skill-workshop"'
    min: 0
    max: 0
    arm: both
