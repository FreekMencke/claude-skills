schema_version: "1.1"
name: skill-workshop-loads-5
tags: [skill-workshop, should-load]
description: "Vetting a third-party skill before install (#103)."
execution:
  prompt: "Is the skill in acme-labs/scroll-kit safe to install? Check it before I add it."
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?skill-workshop"'
