schema_version: "1.1"
name: skill-workshop-skips-7
tags: [skill-workshop, near-miss]
description: "Near miss: vetting npm dependencies, which tech-debt-audit covers (#103)."
execution:
  prompt: "Check the npm packages in package.json for known vulnerabilities and outdated versions."
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?skill-workshop"'
    min: 0
    max: 0
    arm: both
