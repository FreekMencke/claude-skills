schema_version: "1.1"
name: skill-workshop-loads-2
tags: [skill-workshop, should-load]
execution:
  prompt: "Audit my skills/deploy/SKILL.md and tighten it; check published skills that do the same thing."
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?skill-workshop"'
