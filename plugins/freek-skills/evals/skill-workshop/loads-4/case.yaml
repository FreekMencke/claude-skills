schema_version: "1.1"
name: skill-workshop-loads-4
tags: [skill-workshop, should-load]
description: "Overlap check against sibling skills (#3)."
execution:
  prompt: "Check whether the description in skills/deploy/SKILL.md overlaps with our other skills and fix it."
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?skill-workshop"'
