schema_version: "1.1"
name: skill-workshop-skips-6
tags: [skill-workshop, near-miss]
description: "Near miss: a security review of our own diff belongs to security-review (#103)."
execution:
  prompt: "Do a security review of the changes on my current branch before I open the PR."
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?skill-workshop"'
    min: 0
    max: 0
    arm: both
