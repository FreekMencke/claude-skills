schema_version: "1.1"
name: session-lessons-loads-3
tags: [session-lessons, should-load]
execution:
  prompt: "Process the learnings from this session. I corrected you twice on how to land PRs; make sure that sticks for the next agent."
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?session-lessons"'
