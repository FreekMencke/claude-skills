schema_version: "1.1"
name: session-lessons-loads-1
tags: [session-lessons, should-load]
execution:
  prompt: "We're done for today. Go through this session and put what we learned into the repo's skills and docs."
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?session-lessons"'
