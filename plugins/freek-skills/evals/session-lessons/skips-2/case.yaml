schema_version: "1.1"
name: session-lessons-skips-2
tags: [session-lessons, near-miss]
description: "Near miss: skill-workshop."
execution:
  prompt: "Write a new skill for landing PRs in this repo, based on how we do it in the CI scripts."
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?session-lessons"'
    min: 0
    max: 0
    arm: both
