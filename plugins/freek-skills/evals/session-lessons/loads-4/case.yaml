schema_version: "1.1"
name: session-lessons-loads-4
tags: [session-lessons, should-load]
execution:
  prompt: "Before I close this, turn the mistakes we ran into today into rules in our agent docs so the next session doesn't repeat them."
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?session-lessons"'
