schema_version: "1.1"
name: session-lessons-skips-5
tags: [session-lessons, near-miss]
description: "Near miss: a single direct CLAUDE.md edit."
execution:
  prompt: "Add the test command we use, npm run test:unit, to CLAUDE.md."
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?session-lessons"'
    min: 0
    max: 0
    arm: both
