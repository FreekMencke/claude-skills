schema_version: "1.1"
name: session-lessons-skips-3
tags: [session-lessons, near-miss]
description: "Near miss: roadmap-issues."
execution:
  prompt: "This PR needs billing-api to drop the old field too. Open a follow-up issue there."
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?session-lessons"'
    min: 0
    max: 0
    arm: both
