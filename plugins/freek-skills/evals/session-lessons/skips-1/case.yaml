schema_version: "1.1"
name: session-lessons-skips-1
tags: [session-lessons, near-miss]
description: "Near miss: refresh-md-files."
execution:
  prompt: "Check the docs folder for anything that no longer matches the code."
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?session-lessons"'
    min: 0
    max: 0
    arm: both
