schema_version: "1.1"
name: roadmap-issues-skips-5
tags: [roadmap-issues, near-miss]
description: "Near miss: a tech debt audit ending in a remediation roadmap (tech-debt-audit)."
execution:
  prompt: "Audit this repo for tech debt and write a ranked remediation roadmap of what to fix first."
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?roadmap-issues"'
    min: 0
    max: 0
    arm: both
