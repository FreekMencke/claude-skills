schema_version: "1.1"
name: roadmap-issues-skips-1
tags: [roadmap-issues, near-miss]
description: "Near miss: a plain fix."
execution:
  prompt: "Fix the bug from issue #42: the price chart crashes when an item has no history."
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?roadmap-issues"'
    min: 0
    max: 0
    arm: both
