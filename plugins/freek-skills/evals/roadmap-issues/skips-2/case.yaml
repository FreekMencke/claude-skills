schema_version: "1.1"
name: roadmap-issues-skips-2
tags: [roadmap-issues, near-miss]
description: "Near miss: parallel-code-orchestrator."
execution:
  prompt: "Split this refactor of the API client over parallel subagents and integrate the result."
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?roadmap-issues"'
    min: 0
    max: 0
    arm: both
