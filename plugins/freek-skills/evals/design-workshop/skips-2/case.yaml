schema_version: "1.1"
name: design-workshop-skips-2
tags: [design-workshop, near-miss]
description: "Near miss: API design."
execution:
  prompt: "Design the REST API for our booking service: endpoints, status codes and pagination."
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?design-workshop"'
    min: 0
    max: 0
    arm: both
