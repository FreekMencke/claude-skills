schema_version: "1.1"
name: design-workshop-skips-4
tags: [design-workshop, near-miss]
description: "Near miss: designing a skill, skill-workshop territory."
execution:
  prompt: "Design a new skill that reviews Terraform plans before they are applied."
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?design-workshop"'
    min: 0
    max: 0
    arm: both
