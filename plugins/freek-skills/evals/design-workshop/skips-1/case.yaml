schema_version: "1.1"
name: design-workshop-skips-1
tags: [design-workshop, near-miss]
description: "Near miss: database schema design."
execution:
  prompt: "Design a Postgres schema for a booking system with customers, classes and payments."
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?design-workshop"'
    min: 0
    max: 0
    arm: both
