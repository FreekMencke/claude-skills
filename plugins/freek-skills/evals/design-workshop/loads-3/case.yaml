schema_version: "1.1"
name: design-workshop-loads-3
tags: [design-workshop, should-load]
execution:
  prompt: "Our pricing page looks generic, redesign it."
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?design-workshop"'
