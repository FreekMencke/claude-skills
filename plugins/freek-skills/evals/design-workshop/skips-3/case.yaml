schema_version: "1.1"
name: design-workshop-skips-3
tags: [design-workshop, near-miss]
description: "Near miss: building a given mock-up, angular-developer or frontend-design territory."
execution:
  prompt: "Build exactly this mock-up as an Angular component: a pricing card with three tiers, a navy header (#1E2A44), 8px corners and Inter for all text."
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?design-workshop"'
    min: 0
    max: 0
    arm: both
