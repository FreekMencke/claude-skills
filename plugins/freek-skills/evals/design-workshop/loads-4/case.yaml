schema_version: "1.1"
name: design-workshop-loads-4
tags: [design-workshop, should-load]
execution:
  prompt: "Our café's website feels dated. Help me work out a new look before we rebuild it."
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?design-workshop"'
