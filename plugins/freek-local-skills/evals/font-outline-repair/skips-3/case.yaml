schema_version: "1.1"
name: font-outline-repair-skips-3
tags: [font-outline-repair, near-miss]
description: "Near miss: drawing a new glyph."
execution:
  prompt: "Draw a new glyph for the Georgian letter ani in all our weight masters."
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?font-outline-repair"'
    min: 0
    max: 0
    arm: both
