schema_version: "1.1"
name: font-outline-repair-skips-2
tags: [font-outline-repair, near-miss]
description: "Near miss: hinting."
execution:
  prompt: "Add TrueType hinting to our built fonts so they render well on Windows."
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?font-outline-repair"'
    min: 0
    max: 0
    arm: both
