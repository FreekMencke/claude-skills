schema_version: "1.1"
name: font-outline-repair-skips-1
tags: [font-outline-repair, near-miss]
description: "Near miss: kerning design."
execution:
  prompt: "Kern our font by hand: tighten AV, To and LT in the Regular UFO."
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?font-outline-repair"'
    min: 0
    max: 0
    arm: both
