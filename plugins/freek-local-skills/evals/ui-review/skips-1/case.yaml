schema_version: "1.1"
name: ui-review-skips-1
tags: [ui-review, near-miss]
description: "Near miss: what crawlers get, for seo-audit."
execution:
  prompt: "Check whether our item pages send Google the right canonical and robots tags."
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?ui-review"'
    min: 0
    max: 0
    arm: both
