schema_version: "1.1"
name: ui-review-skips-4
tags: [ui-review, near-miss]
description: "Near miss: docs, for refresh-md-files."
execution:
  prompt: "Our README's screenshots and setup steps look stale. Audit the docs."
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?ui-review"'
    min: 0
    max: 0
    arm: both
