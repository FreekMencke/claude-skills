schema_version: "1.1"
name: ui-review-loads-1
tags: [ui-review, should-load]
execution:
  prompt: "Review the UI of http://localhost:4200/items: layout, focus, motion, anything that looks off."
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?ui-review"'
