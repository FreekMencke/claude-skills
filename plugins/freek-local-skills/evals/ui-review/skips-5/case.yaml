schema_version: "1.1"
name: ui-review-skips-5
tags: [ui-review, near-miss]
description: "Near miss: one value on one page, a single browser_evaluate."
execution:
  prompt: "What's the computed font size of the h1 on localhost:4200?"
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?ui-review"'
    min: 0
    max: 0
    arm: both
