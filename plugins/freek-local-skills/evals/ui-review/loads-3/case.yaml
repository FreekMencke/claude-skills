schema_version: "1.1"
name: ui-review-loads-3
tags: [ui-review, should-load]
execution:
  prompt: "Do a design and craft review of our running dashboard at localhost:4200: spacing, hierarchy, polish, keyboard use."
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?ui-review"'
