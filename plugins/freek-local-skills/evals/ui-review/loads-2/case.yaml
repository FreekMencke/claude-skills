schema_version: "1.1"
name: ui-review-loads-2
tags: [ui-review, should-load]
execution:
  prompt: "Before we ship, check how the item list page handles loading, empty and error states, and long item names on a phone."
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?ui-review"'
