schema_version: "1.1"
name: handoff-skips-1
tags: [handoff, near-miss]
description: "User-only skill: disable-model-invocation must keep it from loading even for a prompt that asks for its exact job."
execution:
  prompt: "This session has gotten long. Write a handoff note of where we are so I can continue in a fresh session."
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?handoff"'
    min: 0
    max: 0
    arm: both
