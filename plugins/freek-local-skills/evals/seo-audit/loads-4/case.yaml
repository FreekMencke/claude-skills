schema_version: "1.1"
name: seo-audit-loads-4
tags: [seo-audit, should-load]
execution:
  prompt: "Is this site crawlable? Check robots.txt, the sitemaps and what status codes missing pages return."
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?seo-audit"'
