schema_version: "1.1"
name: seo-audit-skips-1
tags: [seo-audit, near-miss]
description: "Near miss: fixing one tag in code, not auditing."
execution:
  prompt: "Add a rel=canonical link to the product detail component."
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?seo-audit"'
    min: 0
    max: 0
    arm: both
