schema_version: "1.1"
name: seo-audit-loads-1
tags: [seo-audit, should-load]
execution:
  prompt: "Run an SEO audit of https://example.com and tell me what to fix first."
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?seo-audit"'
