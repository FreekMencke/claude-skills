schema_version: "1.1"
name: seo-audit-skips-3
tags: [seo-audit, near-miss]
description: "Near miss: an analytics question for GA4."
execution:
  prompt: "How many sessions came from organic search last month, according to GA4?"
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?seo-audit"'
    min: 0
    max: 0
    arm: both
