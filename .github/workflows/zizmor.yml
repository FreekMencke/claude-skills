name: zizmor

# Audits the workflows and dependabot.yml for security problems: unpinned third-party actions, template injection,
# broad permissions, persisted checkout credentials and more. Its findings fail the check; what's allowed, and why, is
# in .github/zizmor.yml.
on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  # sync-angular-skill.yml starts it on its PR branch: a PR opened with GITHUB_TOKEN starts no pull_request run.
  workflow_dispatch:

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-slim
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          # Fail on findings: with true (the default) it only uploads them to code scanning and passes
          advanced-security: false
          # The default, latest, would let a new zizmor release fail the check by itself
          version: 1.31.1
