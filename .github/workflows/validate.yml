name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # validate needs no credentials. Evals aren't run here: they spend model calls (see README "Check").
      - run: npm install -g @anthropic-ai/claude-code
      # Strict, except for the missing version, which is left out on purpose so installs track commits.
      - name: claude plugin validate
        run: |
          claude --version
          claude plugin validate --json . > validate.json || true
          jq -r '[.manifest] + .contents | .[] | (.errors[] | "error   \(.path): \(.message)"), (.warnings[] | "warning \(.path): \(.message)")' validate.json
          problems=$(jq '[.manifest] + .contents | [.[] | .errors[], (.warnings[] | select(.path | test("(^|→ )version$") | not))] | length' validate.json)
          if [ "$(jq .success validate.json)" != true ] || [ "$problems" -ne 0 ]; then
            echo "::error::claude plugin validate found $problems problem(s) besides the missing version"
            exit 1
          fi
