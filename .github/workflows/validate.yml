name: validate

on:
  push:
    branches: [main]
  pull_request:
  # sync-angular-skill.yml starts it on its PR branch: a PR opened with GITHUB_TOKEN starts no pull_request run.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # validate needs no credentials. Evals aren't run here: they spend model calls (see .claude/CLAUDE.md).
      # validate doesn't flag unknown frontmatter keys; skills/ keeps to name and description (.claude/CLAUDE.md).
      - name: skills/ frontmatter
        run: python3 scripts/check-frontmatter.py
      - run: npm install -g @anthropic-ai/claude-code
      # Strict, except for the missing version, which is left out on purpose so installs track commits.
      # The marketplace check at the root doesn't look inside local-skills/, so validate that plugin too.
      - name: claude plugin validate
        run: |
          claude --version
          status=0
          for target in . local-skills; do
            echo "== $target"
            claude plugin validate --json "$target" > validate.json || true
            jq -r '[.manifest] + .contents | .[] | (.errors[] | "error   \(.path): \(.message)"), (.warnings[] | "warning \(.path): \(.message)")' validate.json
            problems=$(jq '[.manifest] + .contents | [.[] | .errors[], (.warnings[] | select(.path | test("(^|→ )version$") | not))] | length' validate.json)
            if [ "$(jq .success validate.json)" != true ] || [ "$problems" -ne 0 ]; then
              echo "::error::claude plugin validate $target found $problems problem(s) besides the missing version"
              status=1
            fi
          done
          exit $status
