schema_version: "1.1"
name: token-audit-skips-1
tags: [token-audit, near-miss]
description: "User-only skill: disable-model-invocation must keep it from loading even for a prompt that asks for its exact job."
execution:
  prompt: "How much have I spent on Claude Code tokens this month, and what is driving the cost?"
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?token-audit"'
    min: 0
    max: 0
    arm: both
