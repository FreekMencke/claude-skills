schema_version: "1.1"
name: seo-audit-loads-3
tags: [seo-audit, should-load]
execution:
  prompt: "Check whether our Angular SSR pages send crawlers the right title, canonical and robots tags."
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?seo-audit"'
