schema_version: "1.1"
name: claude-kb-lookup-skips-3
tags: [claude-kb-lookup, near-miss]
description: "Near miss: editing the knowledge base."
execution:
  prompt: "Add a new entry to claude-kb about prompt caching."
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?claude-kb-lookup"'
    min: 0
    max: 0
    arm: both
