schema_version: "1.1"
name: claude-kb-lookup-loads-16
tags: [claude-kb-lookup, should-load]
description: "MCP servers (kb-mcp.md)."
execution:
  prompt: "How do I give only one of my subagents access to an MCP server, without the main session loading its tools?"
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?claude-kb-lookup"'
