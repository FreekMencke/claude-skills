schema_version: "1.1"
name: claude-kb-lookup-loads-3
tags: [claude-kb-lookup, should-load]
execution:
  prompt: "How can I cut token cost in long Claude Code sessions?"
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?claude-kb-lookup"'
