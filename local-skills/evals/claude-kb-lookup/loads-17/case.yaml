schema_version: "1.1"
name: claude-kb-lookup-loads-17
tags: [claude-kb-lookup, should-load]
description: "Documentation practice: changelog format (kb-documentation.md)."
execution:
  prompt: "Which changelog format should our repos follow, and should CI fail a PR that has no changelog entry?"
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?claude-kb-lookup"'
