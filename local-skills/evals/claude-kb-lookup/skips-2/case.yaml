schema_version: "1.1"
name: claude-kb-lookup-skips-2
tags: [claude-kb-lookup, near-miss]
description: "Near miss: a code review, not a question about using Claude. (Was \"Write a new skill…\", which the description deliberately covers: \"use before writing an agent or skill\".)"
execution:
  prompt: "Review the diff on this branch for bugs before I open a PR."
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?claude-kb-lookup"'
    min: 0
    max: 0
    arm: both
