schema_version: "1.1"
name: claude-kb-lookup-loads-6
tags: [claude-kb-lookup, should-load]
description: "Prompting (kb-prompting.md)."
execution:
  prompt: "Should a code-reviewer subagent brief say MUST in capitals for the 5.x models?"
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
