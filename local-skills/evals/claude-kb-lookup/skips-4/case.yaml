schema_version: "1.1"
name: claude-kb-lookup-skips-4
tags: [claude-kb-lookup, near-miss]
description: "Near miss: a git hook, not a Claude Code hook."
execution:
  prompt: "Set up a git pre-commit hook in this repo that runs prettier on staged files."
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?claude-kb-lookup"'
    min: 0
    max: 0
    arm: both
