schema_version: "1.1"
name: claude-kb-lookup-loads-11
tags: [claude-kb-lookup, should-load]
description: "Research tool cost (kb-token-usage.md TOK-087 to TOK-102)."
execution:
  prompt: "Is WebFetch or a docs MCP server like context7 cheaper in tokens for looking up library docs in Claude Code?"
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?claude-kb-lookup"'
